[project]
name = "prompt-coach"
version = "0.1.0"
description = "Local-first, privacy-preserving personal prompt coach — analyses your prompt history via local AI and gives you coaching insights."
requires-python = ">=3.12"
dependencies = [
    "typer>=0.15,<0.16",
    "openai>=1.68,<2",
    "httpx>=0.28,<0.29",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
]

[project.scripts]
prompt-coach = "prompt_coach.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_coach"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/prompt_coach"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
    "pytest-cov>=6.0,<7",
    "ruff>=0.9,<0.10",
    "black>=24.10,<25",
    "respx>=0.22,<0.23",
]