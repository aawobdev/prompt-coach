[project]
name = "prompt-coach"
version = "0.1.0"
description = "Local-first, privacy-preserving prompt coach: analyses your prompt history from AI coding tools and coaches you on it, using any OpenAI-compatible model."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Alistair Crawford" }]
requires-python = ">=3.12"
keywords = ["prompts", "prompt-engineering", "llm", "claude-code", "codex", "copilot", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "typer>=0.15,<0.28",
    "httpx>=0.28,<0.29",
    "jinja2>=3.1,<4",
    "pydantic>=2.10,<3",
]

[project.urls]
Homepage = "https://github.com/aawobdev/prompt-coach"
Issues = "https://github.com/aawobdev/prompt-coach/issues"

[project.scripts]
prompt-coach = "prompt_coach.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prompt_coach"]

[tool.uv]
# Rebuild the package whenever its source or commit changes. By default uv
# caches the wheel it builds from a local directory and only rebuilds when
# pyproject.toml/setup.py/setup.cfg change, so `uv tool install --force .`
# (install.sh, and the pull-and-reinstall deploy step) silently reinstalled
# the previous build after a merge that didn't touch pyproject.toml --
# happened live 2026-09-24 with the SessionStart hook. Guarded by
# tests/test_install_freshness.py.
cache-keys = [
    { file = "pyproject.toml" },
    { file = "src/**/*.py" },
    { file = "src/**/*.j2" },
    { git = { commit = true } },
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S105", "S106"]

[tool.ruff.lint.per-file-ignores]
# S310: tests hit their own localhost dashboard server over a fixed http:// URL.
"tests/**" = ["S101", "S105", "S106", "E501", "S603", "S607", "S310"]
# LLM prompt templates are natural-language blocks; wrapping them mid-sentence
# would change the prompts themselves.
"src/prompt_coach/llm/prompts.py" = ["E501"]
# Fixed git binary, args are local filesystem paths only, not untrusted input.
"src/prompt_coach/analysis/docs.py" = ["S603", "S607"]
# Fixed `uv`/`claude` binaries; args are a literal subcommand plus a
# filesystem path this same process resolved, not untrusted input.
"src/prompt_coach/plugin.py" = ["S603"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Argument", "typer.Option"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["src/prompt_coach"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3,<10",
    "pytest-cov>=7.0,<8",
    "ruff>=0.9,<0.10",
    "black>=26.3.1,<27",
    "respx>=0.22,<0.23",
]