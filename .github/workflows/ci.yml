name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: No em dashes in docs
        run: |
          if grep -rlP '\x{2014}' README.md BLUEPRINT.md STATUS.md DECISIONS.md AGENTS.md; then
            echo "Em dash found in a project doc -- house style forbids it (see AGENTS.md)."
            exit 1
          fi
