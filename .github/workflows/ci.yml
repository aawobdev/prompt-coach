name: CI

"on":
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Run tests
        run: uv run pytest -q

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (black)
        run: uv run black --check .

      - name: No em dashes in docs
        run: |
          if grep -rlP '\x{2014}' README.md BLUEPRINT.md STATUS.md DECISIONS.md AGENTS.md; then
            echo "Em dash found in a project doc -- house style forbids it (see AGENTS.md)."
            exit 1
          fi

  plugin:
    # Official manifest/hook validation for the Claude Code plugin under
    # plugin/ and the marketplace at the repo root. Needs no login: checked
    # 2026-09-24 in a clean HOME with no credentials (passes on the real
    # plugin, exits 1 on a misspelt manifest field). Pinned so a Claude Code
    # release can't change the result under us; bump deliberately.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Claude Code
        run: npm install -g --no-fund --no-audit @anthropic-ai/claude-code@2.1.280

      - name: Validate plugin and marketplace
        run: |
          claude plugin validate plugin --strict
          claude plugin validate . --strict
